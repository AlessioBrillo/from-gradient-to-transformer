# CI gate, the only one: GitHub Actions keeps just the Pages deploy. Local: `ci-local`.
# The commitlint step needs git history, which `ci-local` does not copy (it ships the working
# tree only); there it skips, and the commit-msg hook is what enforces the messages.
#
# `docs-audit` (added 2026-10-20) is the record ratchet: `verify-claims` checks that the
# manifests exist and that every tag resolves, but not the prose around the tags, and on
# 2026-10-20 the paper, the writeup, the skill tree and the README still stated claims
# their own manifests had already falsified. See scripts/docs_audit.py.
when:
  - event: [push, manual]

steps:
  - name: gate
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    environment:
      UV_HTTP_TIMEOUT: '300'
    volumes:
      - ci-uv:/root/.cache/uv
    commands:
      - apt-get update -q && apt-get install -y -q make
      - uv sync --frozen --all-extras
      - make lint vault-check typecheck-new typecheck test-cov check-refs docs-audit
      - uv run python -m src.results verify

  - name: paper-check
    # The image was `xu-cheng/latex-action:ubuntu-latest` until the account
    # behind it was emptied upstream. Diagnosed 2026-11-15: the pull fails
    # with "pull access denied" and Docker Hub lists no public repositories
    # for the account -- an upstream deletion, not a paper error.
    # `ghcr.io/xu-cheng/texlive-full` is what the upstream action itself
    # runs on today (see its action.sh), and it carries latexmk + LuaLaTeX.
    image: ghcr.io/xu-cheng/texlive-full:latest
    commands:
      - make paper-check

  - name: markdown-lint
    image: node:22
    commands:
      - npx --yes markdownlint-cli2@0.18 "**/*.md" "#.github" "#LICENSE" "#.venv" "#node_modules"

  - name: commitlint
    image: node:22
    commands:
      - |
        if git rev-parse HEAD~1 >/dev/null 2>&1; then
          npm install --no-save --prefix /tmp/cl @commitlint/cli@19 @commitlint/config-conventional@19
          cp commitlint.config.mjs /tmp/cl/
          /tmp/cl/node_modules/.bin/commitlint --from HEAD~1 --to HEAD --config /tmp/cl/commitlint.config.mjs
        else
          echo "no git history in this checkout: commitlint skipped (commit-msg hook enforces it)"
        fi
