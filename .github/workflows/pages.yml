# Deploy Portfolio to GitHub Pages
# Triggered on push to main branch
# Requires: Settings > Pages > Source: GitHub Actions

name: Deploy Portfolio

on:
  push:
    branches: [main]
    paths:
      # Only rebuild the site when content that reaches it changes. The
      # workflow used to re-run `make reproduce-quick` (20-30 CPU minutes) on
      # every push to main, including pushes that only touched tests/.
      - 'README.md'
      - 'portfolio/**'
      - 'scripts/build_site.py'
      - 'src/results.py'
      - 'Makefile'
  schedule:
    # Weekly refresh of the figures the site ships.
    - cron: '17 4 * * 1'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The quick sweep (notably exp3's 2000-epoch sparsity sweep) needs
    # ~20-30 min on a GH CPU runner; the prior 10-min step timeout failed
    # five consecutive main pushes at ~34% of the sweep. Verified from
    # run logs (e.g. 2026-09-05): timeout, not a science failure.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git history in RESULTS.md verification

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        # No pip cache here: deps install via `uv sync` (cached by
        # setup-uv above). The pip cache post-step flaked the build when
        # the GH cache service was down, failing an otherwise-green run.

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --all-extras

      - name: Verify reproducibility (quick)
        run: |
          make reproduce-quick
        timeout-minutes: 30

      - name: Verify claims
        run: |
          uv run python -m src.results verify

      - name: Compile the mini-paper (LaTeX)
        # build_site.py copies portfolio/paper/main.pdf to the site only if it
        # exists, and the file is not tracked — so before this step the live
        # site never shipped the paper at all. paper.yml compiles it as a CI
        # artifact only; the site needs its own build so the PDF always
        # matches the committed .tex source. Two passes for \bibliography.
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: portfolio/paper
          latexmk_use_lualatex: true
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Build site (README + portfolio -> static HTML)
        # Curated figures come from the committed portfolio/figures/; the
        # quick-mode figures generated above are scratch and must not replace them.
        run: uv run python scripts/build_site.py --out _site

      - name: Verify the site ships the compiled paper
        # A silent regression here would resurrect the pre-2026-10 state: the
        # site live without paper.pdf because nobody checked.
        run: |
          test -f _site/paper.pdf || { echo "::error::_site/paper.pdf missing — the LaTeX step or the build_site.py copy regressed"; exit 1; }
          echo "paper.pdf shipped to the site ($(du -h _site/paper.pdf | cut -f1))."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment
        run: |
          echo "Portfolio deployed to: ${{ steps.deployment.outputs.page_url }}"
          curl -s -o /dev/null -w "%{http_code}" "${{ steps.deployment.outputs.page_url }}" | grep -q "200" && echo "Deployment verified (HTTP 200)" || echo "Warning: Deployment may not be ready yet"