# Deploy Portfolio to GitHub Pages
# Triggered on push to main branch
# Requires: Settings > Pages > Source: GitHub Actions

name: Deploy Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The quick sweep (notably exp3's 2000-epoch sparsity sweep) needs
    # ~20-30 min on a GH CPU runner; the prior 10-min step timeout failed
    # five consecutive main pushes at ~34% of the sweep. Verified from
    # run logs (e.g. 2026-09-05): timeout, not a science failure.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git history in RESULTS.md verification

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --all-extras

      - name: Verify reproducibility (quick)
        run: |
          make reproduce-quick
        timeout-minutes: 30

      - name: Verify claims
        run: |
          uv run python -m src.results verify

      - name: Build portfolio (copy figures, ensure structure)
        run: |
          # Ensure portfolio/figures exists and copy generated figures
          mkdir -p portfolio/figures
          # Copy figures from figures/ to portfolio/figures/ for deployment
          cp -r figures/* portfolio/figures/ 2>/dev/null || true
          # Verify portfolio structure
          ls -la portfolio/
          ls -la portfolio/projects/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment
        run: |
          echo "Portfolio deployed to: ${{ steps.deployment.outputs.page_url }}"
          curl -s -o /dev/null -w "%{http_code}" "${{ steps.deployment.outputs.page_url }}" | grep -q "200" && echo "Deployment verified (HTTP 200)" || echo "Warning: Deployment may not be ready yet"