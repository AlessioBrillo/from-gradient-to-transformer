name: Python CI

on:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - '.github/workflows/*.yml'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
        # Matches uv.lock's resolved interpreter (3.12.12) and
        # pyproject.toml's [tool.mypy] python_version. A prior mismatch here
        # (3.11 pinned while the lockfile resolved 3.12) made mypy crash on
        # numpy's PEP-695 stub syntax before checking a single line of
        # src/ — silently swallowed by `|| true` below, so the "54
        # pre-existing errors" comment that used to live in this file was
        # never actually observed. See pyproject.toml's [tool.mypy] comment
        # and portfolio/RESULTS.md's Honesty Ledger (2026-08-01 entry).

      - name: Install uv
        run: pip install uv

      - name: Cache virtualenv
        id: cache
        uses: actions/cache@v6
        with:
          path: .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Sync dependencies (if cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: uv sync --frozen --all-extras

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Type check — blocking (modules built clean from the start)
        run: uv run mypy src/results.py src/experiments/runner.py --ignore-missing-imports --follow-imports=silent
        # A small, deliberately-growing allowlist of modules held to
        # `mypy --strict` with zero tolerance. New/rewritten modules land
        # here; existing modules move here as their error count is paid
        # down (see the non-blocking step below) — a ratchet, not a
        # someday-fix-it-all pass. src/reproducibility.py and src/models/
        # were checked as candidates and are NOT actually clean (real
        # pre-existing errors), so they are correctly left out rather than
        # promised here without being fixed.
        # --follow-imports=silent: without it, mypy still type-checks (and
        # fails the step on errors in) every module these two files
        # transitively import — e.g. src/experiments/exp1_induction_heads.py
        # via src/experiments/__init__.py — which made this step block on
        # the *non-blocking* tier's pre-existing errors instead of only the
        # two files it actually names. Caught when this exact command
        # (without the flag) exited 1 in CI despite both target files
        # individually reporting zero errors.

      - name: Type check — full tree (non-blocking, tracked follow-up)
        run: |
          set +e
          uv run mypy src/ --ignore-missing-imports
          code=$?
          set -e
          # mypy exit codes: 0 = clean, 1 = type errors reported (the
          # expected, tracked-as-follow-up case), 2 = mypy itself crashed
          # (config error, a stub it can't parse, etc.) — that is NOT the
          # same as "has type errors" and must not be swallowed the way the
          # old `|| true` here did, which is exactly how a python_version
          # mismatch crashing mypy on numpy's stubs went unnoticed for an
          # unknown period (see portfolio/RESULTS.md's Honesty Ledger,
          # 2026-08-01 entry).
          if [ "$code" -eq 2 ]; then
            echo "mypy crashed (exit 2) rather than reporting type errors — failing the build."
            exit 1
          fi
          echo "mypy exited $code; non-blocking (154+ pre-existing errors as of 2026-08-01, mostly missing generic type args — see Makefile's typecheck-strict target)."

      - name: Test (pytest + coverage)
        run: uv run pytest -v --tb=short --cov=src --cov-report=term-missing
