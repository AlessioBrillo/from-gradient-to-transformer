# Capstone Decoder-Only Transformer Configuration
# Joint training: Modular Addition (Grokking) + Induction Heads
# Target: 20k steps, 3 seeds, full mechanistic instrumentation

task:
  name: "modular_addition + induction"
  modular:
    modulus: 113
    train_fraction: 0.3
    max_epochs: 5000  # within 20k step budget
  induction:
    vocab_size: 2048
    seq_len: 128
    num_train: 8192
    prefix_ratio: 0.5

model:
  d_model: 256
  n_layers: 4
  n_heads: 8
  d_mlp: 1024
  dropout: 0.1
  rotary_base: 10000
  rmsnorm_eps: 1e-5

training:
  steps: 20000
  batch_size: 128
  lr: 3e-4
  weight_decay: 0.1
  lr_schedule: "cosine"
  warmup_steps: 1000
  gradient_clip: 1.0
  modular_weight: 1.0
  induction_weight: 1.0

instrumentation:
  fourier_every: 500
  kcomp_every: 500
  sae_hooks: ["ln_final"]
  circuit_patching_every: 2000
  activation_harvest_every: 5000

seeds: [0, 1, 2]
checkpoint_every: 1000
wandb_project: "from-gradient-to-transformer-capstone"
wandb_entity: null  # Set to your W&B entity/username
wandb_tags: ["capstone", "modular_addition", "induction", "mechanistic"]

output:
  figures_dir: "figures"
  checkpoints_dir: "checkpoints"
  results_dir: "results"
  manifest_name: "exp6_capstone.json"