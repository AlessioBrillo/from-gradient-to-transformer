# Phase Diagram Protocol Ablation — issue #168.
#
# Design: start from the Nanda-faithful setup (full-batch AdamW(lr 1e-3,
# betas 0.9/0.98, wd 1.0), constant LR, no LayerNorm, no embedding
# re-normalization, no gradient clipping at P=113) and switch ON exactly ONE
# deviation per cell, plus a weight-decay axis. Every cell is an exp2 run at
# that config (the sweep delegates to exp2's own code — see
# scripts/phase_diagram_sweep.py), budgets are optimizer STEPS (never epochs,
# see the 2026-10-08 audit), 3 seeds per cell.
#
# Pre-registered interpretation (issue #168):
#   - NOT_GROKKED: val_acc < 0.99 at final step (under-trained / broken)
#   - GROKKED + SPARSE: every seed sparse (3/3) under the energy metric
#   - GROKKED + MIXED: 1 or 2 of 3 seeds sparse — a boundary cell, reported
#     as such (never folded into SPARSE)
#   - GROKKED + DENSE: no seed sparse (0/3)
# The L1-mass k_99 is recorded for continuity only; it never classifies.
#
# Clarified 2026-10-19, BEFORE any cell of this sweep had ever been run:
# the runner used to compare the aggregate mean against 0.5 (a majority
# rule) while this comment said "3/3 seeds", and the disagreement was
# invisible because no cell had been executed. The taxonomy above is the
# one that will be applied; the per-seed count (k/3) is reported next to
# every cell so no reader has to infer it from an aggregate. The P=113
# positive control clears the SPARSE bar at 3/3, so the bar is the same one
# the control meets.
#
# Baseline: Nanda-faithful at P=113, wd=1.0, 20k steps (gen-epoch measured at
# ~5919±547 on job A, so 20k gives >3x headroom).
cells:
  # === Baseline: Nanda-faithful (full-batch, constant LR, betas 0.98,
  #     no renorm / layernorm / grad clip) ===
  - cell_id: "p113_nanda_wd10"
    modulus: 113
    d_model: 128
    n_layers: 1
    n_heads: 4
    d_mlp: 512
    weight_decay: 1.0
    mode: "solo"
    protocol: "nanda"
    steps: 20000

  # === Single deviations (baseline + exactly one deviation) ===
  - cell_id: "p113_minibatch_wd10"
    modulus: 113
    d_model: 128
    n_layers: 1
    n_heads: 4
    d_mlp: 512
    weight_decay: 1.0
    mode: "solo"
    protocol: "nanda"
    batch_size: 512
    full_batch: false
    steps: 20000

  - cell_id: "p113_beta2_0999_wd10"
    modulus: 113
    d_model: 128
    n_layers: 1
    n_heads: 4
    d_mlp: 512
    weight_decay: 1.0
    mode: "solo"
    protocol: "nanda"
    beta2: 0.999
    steps: 20000

  - cell_id: "p113_cosine_wd10"
    modulus: 113
    d_model: 128
    n_layers: 1
    n_heads: 4
    d_mlp: 512
    weight_decay: 1.0
    mode: "solo"
    protocol: "nanda"
    schedule: "cosine"
    steps: 20000

  - cell_id: "p113_renorm_wd10"
    modulus: 113
    d_model: 128
    n_layers: 1
    n_heads: 4
    d_mlp: 512
    weight_decay: 1.0
    mode: "solo"
    protocol: "nanda"
    normalize_embeddings: true
    steps: 20000

  - cell_id: "p113_layernorm_wd10"
    modulus: 113
    d_model: 128
    n_layers: 1
    n_heads: 4
    d_mlp: 512
    weight_decay: 1.0
    mode: "solo"
    protocol: "nanda"
    layernorm: true
    steps: 20000

  - cell_id: "p113_gradclip_1_wd10"
    modulus: 113
    d_model: 128
    n_layers: 1
    n_heads: 4
    d_mlp: 512
    weight_decay: 1.0
    mode: "solo"
    protocol: "nanda"
    grad_clip: 1.0
    steps: 20000

  # === Weight-decay axis (baseline protocol, varying wd) ===
  - cell_id: "p113_nanda_wd01"
    modulus: 113
    d_model: 128
    n_layers: 1
    n_heads: 4
    d_mlp: 512
    weight_decay: 0.1
    mode: "solo"
    protocol: "nanda"
    steps: 20000

  - cell_id: "p113_nanda_wd05"
    modulus: 113
    d_model: 128
    n_layers: 1
    n_heads: 4
    d_mlp: 512
    weight_decay: 0.5
    mode: "solo"
    protocol: "nanda"
    steps: 20000

  - cell_id: "p113_nanda_wd20"
    modulus: 113
    d_model: 128
    n_layers: 1
    n_heads: 4
    d_mlp: 512
    weight_decay: 2.0
    mode: "solo"
    protocol: "nanda"
    steps: 20000
