[project]
name = "from-gradient-to-transformer"
version = "1.1.0.dev0"
description = "From gradient descent to mechanistic interpretability: train small transformers and reverse-engineer their internals."
authors = [{ name = "Alessio Brillo" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "wandb>=0.17",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    # Declared explicitly rather than leaned on transitively: exp6_capstone.py
    # and scripts/phase_diagram_sweep.py import yaml directly. It used to work
    # only because wandb happens to depend on PyYAML.
    "pyyaml>=6.0",
]

# ---------------------------------------------------------------------------
# No [build-system] table, deliberately.
#
# This is a research codebase used in place (`uv run python -m
# src.experiments.exp2_grokking`), not a distributable package. A stale
# `src/from_gradient_to_transformer.egg-info/` from an old editable install
# used to live in the tree and was removed on 2026-10-11: the current
# pyproject.toml cannot produce it, because there is no package mapping for the
# flat `src/` layout. If this ever becomes installable, add
# [tool.setuptools] package-dir / packages then — not before.
# ---------------------------------------------------------------------------

# Dropped 2026-08-01: transformer-lens, sae-lens, circuitsvis, einops,
# seaborn, datasets, accelerate were all pinned but never imported anywhere
# in src/ — every hook, patching routine, and training loop here is
# hand-rolled by design (see CLAUDE.md thesis). The one prior reference,
# `transformer_lens.utils.reset_hooks()` in src/reproducibility.py, wasn't
# even a real TransformerLens function; it silently no-op'd inside an
# except clause. A dependency manifest should describe what the code uses,
# not what the project might one day use.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "markdown>=3.5",
    # Executes notebooks/capstone_teaching_artifact_v23.ipynb from CI. Without
    # it a teaching artifact can only be validated by hand, which is how the
    # previous version rotted until all five of its code cells called APIs
    # that no longer existed.
    "nbclient>=0.10",
    "nbformat>=5.10",
]
notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*.py" = ["S101", "N806"]  # allow assert and uppercase X in tests
"src/experiments/*.py" = ["N806", "E741"]  # Uppercase B,S,D,Q,K,V is standard PyTorch convention
"src/models/*.py" = ["N803", "N806", "E741"]  # X, U, Vt, w are standard ML notation
"src/evaluation/*.py" = ["N803", "N806"]  # X is standard ML notation
"src/data/*.py" = ["N803", "N806"]  # X is standard ML notation
# scripts/ is linted on the same terms as src/ since 2026-10-11 (it was
# silently out of scope, which let a real NameError ship in
# scripts/neuron_ablation.py). plot_* and *_sweep legitimately rebind the
# pandas/matplotlib single-letter convention and build hardcoded demo dicts.
"scripts/*.py" = ["E402"]  # plotting scripts do work at import time

[tool.mypy]
# Matches the interpreter uv.lock actually resolves to (3.12.12), not the
# `>=3.11` floor in requires-python above. A `python_version = "3.11"`
# mismatch here made mypy crash on numpy's stub files (which use 3.12-only
# PEP 695 `type` statement syntax) before checking a single line of src/ —
# CI's `mypy ... || true` silently swallowed that crash, so the "54
# pre-existing errors" comment that lived in the CI workflow was never
# actually observed; mypy had never gotten far enough to produce it.
python_version = "3.12"
strict = true
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# Ratchet: the floor is the current measured value, and it only goes up.
# Before this existed there was no threshold anywhere, so coverage could fall
# indefinitely without CI noticing. Measured 2026-10-11 — raise via PR.
fail_under = 55
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
